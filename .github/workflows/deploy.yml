name: Deploy to alltrade-ltd.kz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать тему WordPress
        run: python3 scripts/build_wp_theme.py

      - name: Залить тему на хостинг (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: dist/alltrade-ltd-theme/
          server-dir: httpdocs/wp-content/themes/alltrade-ltd/

      - name: Проверить прод
        run: |
          sleep 5
          code=$(curl -s -o /tmp/page.html -w '%{http_code}' https://alltrade-ltd.kz/)
          echo "HTTP $code"
          test "$code" = "200"
          grep -q "wp-content/themes/alltrade-ltd/assets/" /tmp/page.html
          echo "OK: сайт отдаёт свежую тему"
